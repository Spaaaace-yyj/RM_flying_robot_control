px4_control:
  ros__parameters:
    ego/enabled: true
    ego/planner_goal_topic: /ego_execution/goal
    ego/bspline_topic: /ego_preview/planning/bspline
    ego/depth_pose_topic: /ego_input/camera_pose
    ego/heartbeat_topic: /ego_preview/planning/data_display
    ego/max_goal_distance: 3.0
    ego/min_goal_z: 0.3
    ego/max_goal_z: 2.2
    ego/max_velocity: 0.8
    ego/max_acceleration: 1.5
    ego/planning_timeout: 5.0
    ego/mission_timeout: 45.0
    ego/settle_timeout: 5.0
    ego/max_tracking_error: 0.6
    ego/max_depth_pose_age: 0.8
    ego/max_planner_heartbeat_age: 0.8
    # VINS-Fusion + D435/PX4 IMU / ROS2 Humble / PX4 v1.14.3.
    vins_state_topic: /imu_propagate
    vins_backend_topic: /odometry
    # This Fusion port does not publish a restart Bool. Timestamp/jump/watchdog checks remain active.
    vins_restart_topic: ""
    vins_world_frame: odom
    # Fusion OdomData.velocity is in world coordinates, despite child_frame_id=body.
    vins_velocity_frame: world
    # Rotation mapping PX4 body FLU vectors into the VINS IMU FLU axes.
    # driver_interface already supplies board/body-aligned PX4 IMU: identity.
    imu_from_body_xyzw: [0.0, 0.0, 0.0, 1.0]
    px4_namespace: /fmu
    target_system: 1
    target_component: 1
    source_system: 245
    source_component: 191
    publish_rate_hz: 50.0
    # Incoming DDS timestamps and VINS headers must already share the ROS clock.
    # PX4 XRCE serializes/deserializes timestamps with its session time offset.
    require_timesync: true
    max_timesync_age: 5.0
    max_round_trip_ms: 20.0
    # Add estimator_status_flags to the firmware DDS publications; see README.
    require_ev_status: true
    require_ev_yaw: true
    max_vio_age: 0.8
    max_backend_age: 2.0
    # High-rate local position/attitude watchdog.
    max_px4_age: 1.0
    # PX4 v1.14: vehicle_status ~2 Hz; estimator_status_flags ~1 Hz, or on change.
    max_vehicle_status_age: 1.5
    max_estimator_status_age: 1.5
    stable_seconds: 2.0
    max_vio_speed: 8.0
    max_pose_jump: 0.4
    max_yaw_jump: 0.6
    # Conservative configured measurement stddevs, not Allan IMU noise values.
    position_stddev: 0.1
    velocity_stddev: 0.15
    orientation_stddev: 0.1
    # Default: RC must arm first. true only permits arming after an explicit takeoff service.
    allow_arm_requests: false
    takeoff_height: 0.8
    climb_speed: 0.25
    prime_seconds: 1.5
    command_interval: 1.0
    command_timeout: 8.0
    max_command_attempts: 5
    max_start_speed: 0.35
    max_hover_error: 1.0
    hover_tolerance: 0.15

